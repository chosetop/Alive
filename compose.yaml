name: alive

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alive
      POSTGRES_USER: alive
      POSTGRES_PASSWORD: ${ALIVE_DB_PASSWORD:?Copy .env.docker.example to .env and set ALIVE_DB_PASSWORD}
    volumes:
      - alive-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alive -d alive"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=postgres://alive:${ALIVE_DB_PASSWORD}@db:5432/alive?sslmode=disable
      - up
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: alive
      DB_PASSWORD: ${ALIVE_DB_PASSWORD}
      DB_NAME: alive
      DB_SSLMODE: disable
      CORS_ALLOWED_ORIGINS: http://localhost:${ALIVE_PORT:-8081}
      SESSION_COOKIE_SECURE: "false"
      RATE_LIMIT_ENABLED: "true"
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL_BASE: http://backend:8080
      NUXT_PUBLIC_API_BASE: ""
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    ports:
      - "${ALIVE_BIND_ADDRESS:-127.0.0.1}:${ALIVE_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  alive-postgres:
